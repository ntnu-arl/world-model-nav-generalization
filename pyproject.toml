[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wmnav"
version = "1.0.0"
description = "World-model based drone navigation: data collection, SSL pretraining, RL fine-tuning (DreamerV3), PPO baseline and evaluation"
readme = "README.md"
requires-python = ">=3.8,<3.9"  # Isaac Gym preview 4 supports Python 3.8 only
dependencies = [
    "torch==2.4.1",
    "numpy==1.23.0",
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    "gym==0.23.1",
    "gymnasium==0.29.1",
    "ninja",  # Isaac Gym compiles gymtorch on first import
    "wandb==0.12.21",  # default logging.wandb_mode=offline; not imported when disabled
]
# Not on PyPI, install from source first (see docs/installation.md and requirements.txt):
#   isaacgym (preview 4), aerial_gym (ntnu-arl/aerial_gym_dev, luca_dev @ dcd757dd)

[project.optional-dependencies]
ppo = ["sample-factory==2.1.1"]
analysis = ["pandas==2.0.3", "scikit-image==0.20.0", "scipy==1.10.1"]
all = ["sample-factory==2.1.1", "pandas==2.0.3", "scikit-image==0.20.0", "scipy==1.10.1"]

[tool.setuptools.packages.find]
include = ["wmnav*"]

# python -m ruff check wmnav tests scripts   (style/idiom lint; not a dependency)
[tool.ruff]
target-version = "py38"
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "W", "B", "UP", "SIM", "C4", "PIE", "RET", "PERF", "ISC"]
# Naming rules (N) are left off on purpose: aerial_gym looks up its config classes by
# lowercase name (env, sim, physx, ...), and F / B, T follow PyTorch conventions.

[tool.ruff.lint.per-file-ignores]
"wmnav/env/patches.py" = ["RET504"]  # verbatim copies of aerial_gym methods
