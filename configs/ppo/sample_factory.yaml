# sample-factory hyperparameters of the paper's PPO baseline (static_env_ppo.yaml)
algo: PPO
batched_sampling: true
num_workers: 1
num_envs_per_worker: 1
worker_num_splits: 1
actor_worker_gpus: [0]
use_rnn: false
rnn_size: 512
rnn_num_layers: 1
adaptive_stddev: true
policy_initialization: torch_default
env_gpu_actions: true
reward_scale: 0.1
rollout: 32
max_grad_norm: 1.0
batch_size: 4096
num_batches_per_epoch: 4
num_epochs: 4
ppo_clip_ratio: 0.2
value_loss_coeff: 2.0
exploration_loss_coeff: 0.0
nonlinearity: elu
learning_rate: 1.0e-4
lr_schedule: kl_adaptive_epoch
lr_schedule_kl_threshold: 0.016
shuffle_minibatches: true
gamma: 0.99
gae_lambda: 0.95
with_vtrace: false
value_bootstrap: true          # a win is reported as a truncation, so it is bootstrapped like the WM's cont
normalize_input: true
normalize_returns: true
normalize_input_keys: [robot_state]
save_best_after: 5000000
serial_mode: true
async_rl: false
use_env_info_cache: false
kl_loss_coeff: 0.1
actor_critic_share_weights: true
keep_checkpoints: 10
with_wandb: false              # wmnav logs W&B itself
